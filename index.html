function resolverCanalInicial(refCompra, marca) {
  const ref = String(refCompra || '').trim().toUpperCase();
  if (!ref) return '';
  const isAdi = String(marca || '').toUpperCase().includes('ADI');
  const pool = isAdi ? TIENDAS_ADIDAS : TIENDAS_REEBOK;
  if (pool.has(ref)) return 'TIENDAS';
  return normalizarCanal(ref);
}
function normalizarCanal(c) {
  let s = String(c || '').trim().toUpperCase();
  if (s === 'EXCLUSIVO WEB' || s === 'WEB REEBOK MEDEPORT') return 'WEB';
  return s;
}

const fmoney = n => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const normTalla = t => String(t || '').trim().replace(',', '.').replace(/^0+/, '');

function calcValorNeto(r) {
  const fob = Number(r['FOB'] || 0);
  const qty = Number(r['Cantidad'] || 0);
  return Math.round(fob * qty * 10000) / 10000;
}

function hasPriceChange(r) {
  const pvpIni = Number(r['PVP'] || 0);
  const pvpFin = Number(r['PVP Final'] || 0);
  return pvpFin > 0 && Math.abs(pvpIni - pvpFin) > 0.001;
}

function fdate(v) {
  if (!v) return '';
  if (v instanceof Date && !isNaN(v)) return v.getFullYear() + '-' + String(v.getMonth() + 1).padStart(2, '0') + '-' + String(v.getDate()).padStart(2, '0');
  return String(v).trim();
}
function getQuincena(fechaStr) {
  const s = String(fechaStr || '').trim();
  if (!s) return '';
  let day = 0;
  if (/^\d{4}-\d{1,2}-\d{1,2}/.test(s)) {
    day = parseInt(s.split('-')[2], 10);
  } else if (/^\d{1,2}\/\d{1,2}\/\d{2,4}/.test(s)) {
    day = parseInt(s.split('/')[0], 10);
  }
  if (!day || isNaN(day)) return '';
  return day <= 15 ? 'q1' : 'q2';
}

/* ============ MOTOR INDEXEDDB LOCAL ============ */
const rq = r => new Promise((ok, ko) => { r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
const txDone = t => new Promise((ok, ko) => { t.oncomplete = ok; t.onerror = t.onabort = () => ko(t.error); });
function openDB() {
  return new Promise((ok, ko) => {
    const r = indexedDB.open('eot-db-local-v4', 1);
    r.onupgradeneeded = () => {
      const s = r.result.createObjectStore('rows', { keyPath: 'id', autoIncrement: true });
      s.createIndex('sb', 'sb');
      r.result.createObjectStore('meta');
    };
    r.onsuccess = () => ok(r.result);
    r.onerror = () => ko(r.error);
  });
}
async function dbAdd(rows, label) {
  for (let i = 0; i < rows.length; i += 10000) {
    const t = db.transaction('rows', 'readwrite'), s = t.objectStore('rows');
    rows.slice(i, i + 10000).forEach(r => s.add(r));
    await txDone(t);
    if (label && rows.length > 10000) {
      busy(label + ' ' + fn(Math.min(i + 10000, rows.length)) + ' / ' + fn(rows.length));
      await tick();
    }
  }
}
async function dbPut(rows) {
  for (let i = 0; i < rows.length; i += 10000) {
    const t = db.transaction('rows', 'readwrite'), s = t.objectStore('rows');
    rows.slice(i, i + 10000).forEach(r => s.put(r));
    await txDone(t);
  }
}
async function dbDeleteIds(ids) {
  for (let i = 0; i < ids.length; i += 10000) {
    const t = db.transaction('rows', 'readwrite'), s = t.objectStore('rows');
    ids.slice(i, i + 10000).forEach(id => s.delete(id));
    await txDone(t);
  }
}
async function dbDelSeason(key) {
  const t = db.transaction('rows', 'readwrite'), s = t.objectStore('rows');
  const ks = await rq(s.index('sb').getAllKeys(key));
  ks.forEach(k => s.delete(k));
  await txDone(t);
}
const dbSeason = key => rq(db.transaction('rows').objectStore('rows').index('sb').getAll(key));
async function getAllBrandRows(brand) {
  const seasonsList = S.seasons[brand] || [];
  const ordered = [S.season, ...seasonsList.filter(s => s !== S.season)];
  let all = [];
  for (const s of ordered) {
    if (!s) continue;
    const chunk = await dbSeason(brand + '|' + s);
    all = all.concat(chunk);
  }
  return all;
}
async function saveMeta() {
  const t = db.transaction('meta', 'readwrite');
  t.objectStore('meta').put(S.seasons, 'seasons');
  t.objectStore('meta').put({ brand: S.brand, season: S.season }, 'active');
  t.objectStore('meta').put(S.logos, 'logos');
  t.objectStore('meta').put(S.templates, 'templates');
  await txDone(t);
}
async function refreshCounts() {
  for (const b in S.seasons) {
    for (const s of S.seasons[b]) {
      S.counts[b + '|' + s] = await rq(db.transaction('rows').objectStore('rows').index('sb').count(b + '|' + s));
    }
  }
}
async function reload() {
  const rawRows = S.season ? await dbSeason(sbKey()) : [];
  const migrated = [];
  rawRows.forEach(r => {
    let dirty = false;
    if (r['FOB'] === undefined) {
      r['FOB'] = 0;
      dirty = true;
    }
    const calcVn = calcValorNeto(r);
    if (r['Valor Neto'] === undefined || (r['FOB'] > 0 && r['Cantidad'] > 0 && !r['Valor Neto'])) {
      r['Valor Neto'] = calcVn;
      dirty = true;
    }
    // Todo registro histórico que no tenga Detalle compra asignado se etiqueta automáticamente como COMPRA CANAL
    if (!r['Detalle compra'] || !String(r['Detalle compra']).trim()) {
      r['Detalle compra'] = 'COMPRA CANAL';
      dirty = true;
    }
    if (dirty && r.id != null) migrated.push(r);
  });
  if (migrated.length) {
    await dbPut(migrated);
  }
  S.rows = rawRows;
  await refreshCounts();
  render();
}

function getTplData(key = sbKey()) {
  const raw = S.templates[key];
  if (!raw) return { headers: [], items: {} };
  if (raw.items && Array.isArray(raw.headers)) return raw;
  return {
    headers: ['Código', 'Descripción', 'Grupo', 'Actividad', 'Género', 'Color', 'FOB', 'PVP', 'PVP retail', 'P4', 'PMY', 'Fecha de entrega', 'Fecha de venta'],
    items: raw
  };
}
function isRowLockedByEmbarque(r) {
  return Boolean(String(r['EMBARQUE'] || '').trim());
}

function applyTemplateToRow(r, tplCatalog) {
  const itemsMap = tplCatalog && tplCatalog.items ? tplCatalog.items : tplCatalog;
  if (!itemsMap || isRowLockedByEmbarque(r)) return false;
  const cod = norm(r['Código']);
  if (!cod) return false;
  const item = itemsMap[cod];
  if (!item) return false;

  let changed = false;
  if (item.descripcion && r['Descripción'] !== item.descripcion) { r['Descripción'] = item.descripcion; changed = true; }
  if (item.grupo && r['Grupo'] !== item.grupo) { r['Grupo'] = item.grupo; changed = true; }
  if (item.actividad && r['Actividad'] !== item.actividad) { r['Actividad'] = item.actividad; changed = true; }
  if (item.genero && r['Género'] !== item.genero) { r['Género'] = item.genero; changed = true; }
  if (item.color && (!r['Color'] || norm(r['Color']) === 'faltacolor')) { r['Color'] = item.color; changed = true; }
  if (item.fEntrega && r['Fecha de entrega'] !== item.fEntrega) { r['Fecha de entrega'] = item.fEntrega; changed = true; }
  if (item.fVenta && r['Fecha de venta'] !== item.fVenta) { r['Fecha de venta'] = item.fVenta; changed = true; }

  if (item.fob > 0 && Math.abs((Number(r['FOB']) || 0) - item.fob) > 0.0001) {
    r['FOB'] = item.fob;
    changed = true;
  }
  if (item.pvp > 0 && Math.abs((Number(r['PVP']) || 0) - item.pvp) > 0.001) {
    r['PVP'] = item.pvp;
    changed = true;
  }
  if (item.pvpRetail > 0 && Math.abs((Number(r['PVP retail']) || 0) - item.pvpRetail) > 0.001) {
    r['PVP retail'] = item.pvpRetail;
    changed = true;
  }
  if (item.p4 > 0 && Math.abs((Number(r['P4']) || 0) - item.p4) > 0.001) {
    r['P4'] = item.p4;
    changed = true;
  }
  if (item.pmy > 0 && Math.abs((Number(r['PMY']) || 0) - item.pmy) > 0.001) {
    r['PMY'] = item.pmy;
    changed = true;
  }
  const newVn = calcValorNeto(r);
  if (Math.abs((Number(r['Valor Neto']) || 0) - newVn) > 0.0001) {
    r['Valor Neto'] = newVn;
    changed = true;
  }
  return changed;
}

function getTplRowArray(it, headers) {
  if (Array.isArray(it.fullRow) && it.fullRow.length) return it.fullRow;
  return [
    it.codigo || '', it.descripcion || '', it.grupo || '', it.actividad || '', it.genero || '', it.color || '',
    it.fob || 0, it.pvp || 0, it.pvpRetail || 0, it.p4 || 0, it.pmy || 0, it.fEntrega || '', it.fVenta || ''
  ];
}

function exportPresentationTemplate() {
  const { headers, items } = getTplData(sbKey());
  const list = Object.values(items);
  if (!list.length) return modal('Sin plantilla', 'No hay datos en la plantilla de presentación actual.');
  const aoa = [
    headers,
    ...list.map(it => getTplRowArray(it, headers))
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'CONSOLIDADO');
  XLSX.writeFile(wb, `PLANTILLA_PRESENTACION_${S.brand}_${S.season}.xlsx`);
}

async function loadPresentationTemplate(file) {
  try {
    busy('Analizando Plantilla de Presentación…');
    await tick();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    // Buscar la hoja CONSOLIDADO o la primera hoja
    const targetSheetName = wb.SheetNames.find(n => norm(n).includes('consolidado')) || wb.SheetNames[0];
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[targetSheetName], { header: 1, defval: '', raw: true });
    if (!aoa.length) throw new Error('La hoja de la plantilla está vacía.');

    // Detectar dinámicamente la fila de encabezados real (donde aparece CODIGO y FOB/PVP/DETALLE)
    let headerRowIdx = -1;
    for (let i = 0; i < Math.min(15, aoa.length); i++) {
      const rowNorm = aoa[i].map(c => norm(c));
      if (rowNorm.includes('codigo') && (rowNorm.includes('fob') || rowNorm.includes('pvp') || rowNorm.includes('detalle'))) {
        headerRowIdx = i;
        break;
      }
    }
    if (headerRowIdx === -1) {
      throw new Error('No se encontró la fila de encabezados con "CODIGO" y "FOB/PVP/DETALLE" en la plantilla.');
    }

    const rawHeaders = aoa[headerRowIdx].map((h, idx) => String(h ?? '').trim() || `COL_${idx + 1}`);
    const colIdx = {};
    rawHeaders.forEach((h, idx) => {
      const nh = norm(h);
      if (!nh) return;
      if (colIdx[nh] === undefined) colIdx[nh] = idx;
    });

    const getCell = (rowArr, aliases) => {
      for (const a of aliases) {
        const idx = colIdx[norm(a)];
        if (idx !== undefined && rowArr[idx] !== undefined && rowArr[idx] !== '') {
          return rowArr[idx];
        }
      }
      return '';
    };

    const prevEntry = S.templates[sbKey()];
    const prevItems = prevEntry && prevEntry.items ? prevEntry.items : (prevEntry && !prevEntry.items ? prevEntry : {});
    const existingCatalog = tplUploadMode === 'merge' ? { ...prevItems } : {};
    const finalHeaders = (tplUploadMode === 'merge' && prevEntry && Array.isArray(prevEntry.headers) && prevEntry.headers.length >= rawHeaders.length)
      ? prevEntry.headers
      : rawHeaders;
    let parsedSkus = 0;

    for (let i = headerRowIdx + 1; i < aoa.length; i++) {
      const rowArr = aoa[i];
      const codRaw = String(getCell(rowArr, ['CODIGO', 'Código', 'SAP'])).trim();
      const cod = norm(codRaw);
      if (!cod || cod === 'origen') continue;

      const colorRaw = String(getCell(rowArr, ['COLOR PRINCIPAL', 'Color'])).trim();
      const colorClean = (colorRaw && colorRaw !== '-' && !norm(colorRaw).includes('faltacolor')) ? colorRaw : '';

      const fullRow = finalHeaders.map((hName, hIdx) => {
        const origIdx = rawHeaders.indexOf(hName);
        const val = origIdx !== -1 ? rowArr[origIdx] : rowArr[hIdx];
        if (val instanceof Date && !isNaN(val)) return fdate(val);
        return val == null ? '' : val;
      });

      existingCatalog[cod] = {
        codigo: codRaw,
        descripcion: String(getCell(rowArr, ['DETALLE', 'Descripción', 'DESCRIPCION'])).trim(),
        grupo: String(getCell(rowArr, ['GRUPO', 'Grupo'])).trim(),
        actividad: String(getCell(rowArr, ['ACTIVIDAD', 'Actividad'])).trim(),
        genero: String(getCell(rowArr, ['GENERO', 'Género'])).trim(),
        color: colorClean,
        fob: Number(String(getCell(rowArr, ['FOB']) || 0).replace(',', '.')) || 0,
        pvp: Number(String(getCell(rowArr, ['PVP']) || 0).replace(',', '.')) || 0,
        pvpRetail: Number(String(getCell(rowArr, ['PVP RETAIL', 'PVP retail']) || 0).replace(',', '.')) || 0,
        p4: Number(String(getCell(rowArr, ['P4']) || 0).replace(',', '.')) || 0,
        pmy: Number(String(getCell(rowArr, ['PMY']) || 0).replace(',', '.')) || 0,
        fEntrega: fdate(getCell(rowArr, ['FECHA DE ENTREGA', 'Fecha de entrega'])),
        fVenta: fdate(getCell(rowArr, ['FECHA DE VENTA', 'Fecha de venta'])),
        fullRow
      };
      parsedSkus++;
    }

    if (!parsedSkus) {
      throw new Error('No se encontraron filas con códigos válidos debajo de los encabezados.');
    }

    S.templates[sbKey()] = { headers: finalHeaders, items: existingCatalog };
    await saveMeta();

    // Aplicar inmediatamente solo a las filas existentes que NO tienen EMBARQUE asignado
    const modifiedRows = [];
    let skippedLocked = 0;
    for (const r of S.rows) {
      if (isRowLockedByEmbarque(r)) {
        skippedLocked++;
        continue;
      }
      if (applyTemplateToRow(r, existingCatalog)) {
        modifiedRows.push(r);
      }
    }

    if (modifiedRows.length) {
      busy('Sincronizando registros sin embarque…');
      await tick();
      await dbPut(modifiedRows);
    }

    await reload();
    busy();

    modal(
      'Plantilla de Presentación Sincronizada',
      `<div class="space-y-2">
         <p>Se procesaron <b>${fn(parsedSkus)} SKUs</b> en el catálogo maestro de <b>${S.brand} ${esc(S.season)}</b> (Total catálogo: <b>${fn(Object.keys(existingCatalog).length)} SKUs</b>).</p>
         <div class="p-3 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs space-y-1">
           <div>✓ <b>${fn(modifiedRows.length)} líneas</b> sin embarque fueron actualizadas (descripción, FOB, precios iniciales y fechas).</div>
           <div>🔒 <b>${fn(skippedLocked)} líneas</b> que ya tienen <b>EMBARQUE</b> asignado se mantuvieron intactas sin alterar sus precios.</div>
         </div>
         <p class="text-xs text-slate-500">Cualquier compra inicial o compra extra que cargues a partir de ahora tomará automáticamente la información de esta plantilla.</p>
       </div>`
    );
  } catch(e) {
    busy();
    modal('Error al procesar Plantilla de Presentación', esc(e.message || e));
  }
}
/* ============ PARSER DE EXCEL (COMPRA INICIAL / EXTRA) ============ */
async function parseExcelFile(file, tipoCompra) {
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
  const sheet = wb.SheetNames[0];
  const raw = XLSX.utils.sheet_to_json(wb.Sheets[sheet], { defval: '', raw: true });
  if (!raw.length) throw new Error('El archivo no contiene filas legibles.');
  const fileHeaders = Object.keys(raw[0]);
  const headerMap = {};
  
  MASTER_COLS.forEach(mCol => {
    const nCol = norm(mCol);
    const found = fileHeaders.find(h => norm(h) === nCol);
    if (found) headerMap[mCol] = found;
  });

  if (!headerMap['FOB']) {
    const fobFallback = fileHeaders.find(h => ['fob', 'costofob', 'preciofob', 'fobunitario', 'valorfob'].includes(norm(h)));
    if (fobFallback) headerMap['FOB'] = fobFallback;
  }
  
  if (!headerMap['Código'] || !headerMap['Cantidad']) {
    throw new Error('El archivo debe incluir obligatoriamente las columnas "Código" y "Cantidad".');
  }
  
  const rows = [];
  for (const o of raw) {
    const r = {};
    MASTER_COLS.forEach(col => {
      const val = headerMap[col] ? o[headerMap[col]] : '';
      if (NUM_COLS.includes(col)) {
        r[col] = Number(String(val || 0).replace(',', '.')) || 0;
      } else if (col.includes('Fecha')) {
        r[col] = fdate(val);
      } else {
        r[col] = val == null ? '' : String(val).trim();
      }
    });
    if (tipoCompra) {
      r['Detalle compra'] = tipoCompra;
    } else if (!r['Detalle compra']) {
      r['Detalle compra'] = 'COMPRA CANAL';
    }
    if (!r['Canal Inicial']) {
      r['Canal Inicial'] = resolverCanalInicial(r['Referencia compra'], S.brand);
    }
    if (!r['Canal Final']) r['Canal Final'] = '';
    if (!r['PVP Final']) r['PVP Final'] = 0;
    if (!r['P4 Final']) r['P4 Final'] = 0;
    if (!r['PMY Final']) r['PMY Final'] = 0;
    if (!r['Etapa']) r['Etapa'] = E10;
    if (!r['Temporada']) r['Temporada'] = S.season;
    const tplCatalog = S.templates[sbKey()];
    if (tplCatalog) {
      applyTemplateToRow(r, tplCatalog);
    }
    r['Valor Neto'] = calcValorNeto(r);
    r.sb = sbKey();
    r.brand = S.brand;
    r.season = S.season;
    if (r['Código'] && r['Cantidad'] > 0) rows.push(r);
  }
  return rows;
}

async function revertOcsByKeys(selectedKeys) {
  busy('Revirtiendo OCs y consolidando saldos 10A…');
  await tick();
  const pool10A = new Map();
  S.rows.forEach(r => {
    if (st(r) === 'o') {
      const k = `${norm(r['Código'])}|${norm(r['Color'])}|${normTalla(r['Talla'])}|${norm(r['Referencia compra'])}|${norm(r['Seguimiento'])}|${norm(r['Detalle compra'])}`;
      if (!pool10A.has(k)) pool10A.set(k, r);
    }
  });
  const toUpdate = new Set();
  const toDeleteIds = [];
  let revertedUnits = 0;
  for (const r of S.rows) {
    if (st(r) !== 'p') continue;
    const fact = String(r['Factura'] || '').trim() || 'SIN FACTURA';
    const emb = String(r['EMBARQUE'] || '').trim() || 'SIN EMBARQUE';
    const key = `${fact}|||${emb}`;
    if (!selectedKeys.has(key)) continue;
    const qty = Number(r['Cantidad'] || 0);
    revertedUnits += qty;
    const mergeKey = `${norm(r['Código'])}|${norm(r['Color'])}|${normTalla(r['Talla'])}|${norm(r['Referencia compra'])}|${norm(r['Seguimiento'])}|${norm(r['Detalle compra'])}`;
    const existing10A = pool10A.get(mergeKey);
    if (existing10A && existing10A.id !== r.id) {
      existing10A['Cantidad'] = (Number(existing10A['Cantidad']) || 0) + qty;
      existing10A['Valor Neto'] = calcValorNeto(existing10A);
      toUpdate.add(existing10A);
      if (r.id != null) toDeleteIds.push(r.id);
    } else {
      r['Etapa'] = E10;
      r['Factura'] = '';
      r['Fecha de factura'] = '';
      r['EMBARQUE'] = '';
      r['Canal Final'] = '';
      r['PVP Final'] = 0;
      r['P4 Final'] = 0;
      r['PMY Final'] = 0;
      r['Valor Neto'] = calcValorNeto(r);
      toUpdate.add(r);
      pool10A.set(mergeKey, r);
    }
  }
  if (toUpdate.size) await dbPut([...toUpdate]);
  if (toDeleteIds.length) await dbDeleteIds(toDeleteIds);
  await reload();
  busy();
  modal('OCs Revertidas', `Se devolvieron <b>${fn(revertedUnits)} unidades</b> a estado disponible <b>10A</b> y se recalcularon los valores netos.`);
}

const getRowVal = (o, keys) => {
  for (const k of keys) {
    if (o[k] !== undefined && o[k] !== '') return o[k];

  const normKeys = keys.map(k => norm(k));
  for (const origKey of Object.keys(o)) {

      return o[origKey];
    }
  }
  return '';

function mergePools(...lists) {
  const seen = new Set();
  const res = [];
  for (const lst of lists) {
    if (!lst) continue;
    for (const item of lst) {
      if (!seen.has(item)) {
        seen.add(item);
        res.push(item);
      }
    }
  }
  return res;
}
/* ============ 4A. CRUCE OC PRELIMINAR MULTITEMPORADA (CON RESPALDO TALLA MARCA) ============ */
async function loadOcPreliminar(file) {
  try {
    busy('Leyendo OC preliminar y cargando temporadas de ' + S.brand + '…');
    await tick();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    const targetSheet = wb.Sheets['OC'] ? 'OC' : wb.SheetNames[0];
    const raw = XLSX.utils.sheet_to_json(wb.Sheets[targetSheet], { defval: '', raw: true });
    if (!raw.length) throw new Error('No se encontraron filas en el archivo de OC.');
    const allBrandRows = await getAllBrandRows(S.brand);
    const seasonExactIndex = new Map();
    const seasonSkuTalIndex = new Map();
    const exactIndex = new Map();
    const skuTallaIndex = new Map();
    const seasonExactTalMIndex = new Map();
    const exactTalMIndex = new Map();
    const seasonSkuTalMIndex = new Map();
    const skuTalMIndex = new Map();
    const pushIdx = (map, k, row) => {
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(row);
    };
    allBrandRows.forEach(r => {
      if (st(r) === 'o') {
        const temp = norm(r.season || r['Temporada']);
        const cod = norm(r['Código']);
        const col = norm(r['Color']);
        const tal = normTalla(r['Talla']);
        const talM = normTalla(r['Talla marca']);
        if (tal) {
          pushIdx(seasonExactIndex, `${temp}|${cod}|${col}|${tal}`, r);
          pushIdx(seasonSkuTalIndex, `${temp}|${cod}|${tal}`, r);
          pushIdx(exactIndex, `${cod}|${col}|${tal}`, r);
          pushIdx(skuTallaIndex, `${cod}|${tal}`, r);
        }
        if (talM) {
          pushIdx(seasonExactTalMIndex, `${temp}|${cod}|${col}|${talM}`, r);
          pushIdx(exactTalMIndex, `${cod}|${col}|${talM}`, r);
          pushIdx(seasonSkuTalMIndex, `${temp}|${cod}|${talM}`, r);
          pushIdx(skuTalMIndex, `${cod}|${talM}`, r);
        }
      }
    });
    const changed = new Set();
    const added = [];
    let matchedUnits = 0;
    let matchedLines = 0;
    const perSeasonUnits = {};
    const unmatched = [];
    for (const o of raw) {
      const temp = norm(getRowVal(o, ['Temporada', 'Season']));
      const cod = norm(getRowVal(o, ['Código', 'Codigo', 'SAP']));
      const col = norm(getRowVal(o, ['Color']));
      const tal = normTalla(getRowVal(o, ['Talla']));
      const talM = normTalla(getRowVal(o, ['Talla marca', 'Talla Marca', 'TALLA MARCA'])) || tal;
      const qty = Number(String(getRowVal(o, ['Cantidad', 'QTY']) || 0).replace(',', '.')) || 0;
      const fact = String(getRowVal(o, ['Factura', 'No FACTURA', 'No FACTURA '])).trim();
      const embFinal = String(getRowVal(o, ['EMBARQUE', 'Embarque', 'Nº de embarque', 'EMBARQUES'])).trim();
      const fFact = fdate(getRowVal(o, ['Fecha de factura']));
      const refFinal = String(getRowVal(o, ['Referencia compra', 'CANAL'])).trim();
      if (!cod || qty <= 0) continue;
      const pool = mergePools(
        (temp && tal) ? seasonExactIndex.get(`${temp}|${cod}|${col}|${tal}`) : null,
        tal ? exactIndex.get(`${cod}|${col}|${tal}`) : null,
        (temp && tal) ? seasonSkuTalIndex.get(`${temp}|${cod}|${tal}`) : null,
        tal ? skuTallaIndex.get(`${cod}|${tal}`) : null,
        (temp && talM) ? seasonExactTalMIndex.get(`${temp}|${cod}|${col}|${talM}`) : null,
        talM ? exactTalMIndex.get(`${cod}|${col}|${talM}`) : null,
        (temp && talM) ? seasonSkuTalMIndex.get(`${temp}|${cod}|${talM}`) : null,
        talM ? skuTalMIndex.get(`${cod}|${talM}`) : null,
        (temp && talM) ? seasonExactIndex.get(`${temp}|${cod}|${col}|${talM}`) : null,
        talM ? exactIndex.get(`${cod}|${col}|${talM}`) : null
      );
      if (!pool.length || !pool.some(r => r['Cantidad'] > 0)) {
        unmatched.push({ cod: getRowVal(o, ['Código', 'Codigo', 'SAP']), col: o['Color'], tal: o['Talla'], qty });
        continue;
      }
      let rem = qty;
      for (let i = 0; i < pool.length && rem > 0; i++) {
        const baseRow = pool[i];
        if (baseRow['Cantidad'] <= 0 || baseRow['Etapa'].startsWith('P24')) continue;
        const rowSeason = baseRow.season || S.season;
        if (baseRow['Cantidad'] <= rem) {
          const take = baseRow['Cantidad'];
          rem -= take;
          matchedUnits += take;
          perSeasonUnits[rowSeason] = (perSeasonUnits[rowSeason] || 0) + take;
          baseRow['Etapa'] = EP;
          if (fact) baseRow['Factura'] = fact;
          if (fFact) baseRow['Fecha de factura'] = fFact;
          if (embFinal) baseRow['EMBARQUE'] = embFinal;
          if (refFinal && !baseRow['Referencia compra']) baseRow['Referencia compra'] = refFinal;
          baseRow['Valor Neto'] = calcValorNeto(baseRow);
          changed.add(baseRow);
        } else {
          const facturada = { ...baseRow };
          delete facturada.id;
          facturada['Cantidad'] = rem;
          facturada['Etapa'] = EP;
          if (fact) facturada['Factura'] = fact;
          if (fFact) facturada['Fecha de factura'] = fFact;
          if (embFinal) facturada['EMBARQUE'] = embFinal;
          if (refFinal && !facturada['Referencia compra']) facturada['Referencia compra'] = refFinal;
          facturada['Valor Neto'] = calcValorNeto(facturada);

          baseRow['Cantidad'] -= rem;
          baseRow['Valor Neto'] = calcValorNeto(baseRow);
          matchedUnits += rem;
          perSeasonUnits[rowSeason] = (perSeasonUnits[rowSeason] || 0) + rem;
          rem = 0;
          changed.add(baseRow);
          added.push(facturada);
        }
      }
      matchedLines++;
    }
    busy();
    const breakdown = Object.entries(perSeasonUnits)
      .map(([sName, u]) => `<span class="inline-block bg-slate-100 border px-2 py-0.5 rounded text-xs font-semibold mr-1.5">${esc(sName)}: ${fn(u)} unid.</span>`)
      .join('');
    const ch = await modal(
      'Confirmar cruce preliminar',
      `<p>Se descontaron con éxito <b>${fn(matchedUnits)} unidades</b> en ${fn(matchedLines)} líneas que pasan a <b>P24</b>:</p>
       <div class="my-2">${breakdown || '<span class="text-xs text-slate-400">Sin unidades cruzadas</span>'}</div>
       <p class="text-xs text-slate-500 mt-1">El saldo 10A ha quedado liberado en sus respectivas temporadas.</p>
       ${unmatched.length ? `<p class="text-amber-600 mt-2 text-xs"><b>${unmatched.length} filas</b> no encontraron saldo disponible en ninguna temporada de ${S.brand}.</p>` : ''}`,
      [['Cancelar', 'c'], ['Aplicar a la base', 'ok', 1]]
    );
    if (ch !== 'ok') return;
    busy('Actualizando base de datos…');
    await tick();
    await dbPut([...changed]);
    if (added.length) await dbAdd(added);
    await reload();
    busy();
    modal('OC Preliminar Cargada', `Se pasaron ${fn(matchedUnits)} unidades a <b>P24</b>.`);
  } catch(e) {
    busy();
    modal('Error en cruce preliminar', esc(e.message || e));
  }
}

async function importJsonBackup(file) {
  try {
    busy('Leyendo archivo JSON…');
    await tick();
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data.rows || !Array.isArray(data.rows)) {
      throw new Error('El archivo JSON no tiene el formato de respaldo válido del sistema.');
    }
    const b = data.brand || S.brand;
    const s = data.season || S.season;
    const count = data.rows.length;
    busy();
    const c = await modal(
      'Importar respaldo JSON',
      `El archivo contiene <b>${fn(count)} filas</b> correspondientes a <b>${b} ${s}</b>.<br><br>
      ¿Deseas cargar estos datos en tu navegador? Se reemplazarán los registros actuales de esa temporada.`,
      [['Cancelar', 'c'], ['Sí, importar datos', 'ok', 1]]
    );
    if (c !== 'ok') return;
    if (!S.seasons[b]) S.seasons[b] = [];
    if (!S.seasons[b].includes(s)) S.seasons[b].push(s);
    S.brand = b;
    S.season = s;
    const targetKey = b + '|' + s;
    await saveMeta();
    busy('Guardando datos en la base local…');
    await tick();
    await dbDelSeason(targetKey);
    
    const cleanRows = data.rows.map(r => {
      const row = { ...r, sb: targetKey, brand: b, season: s };
      if (row['FOB'] === undefined) row['FOB'] = 0;
      row['Valor Neto'] = calcValorNeto(row);
      if (!row['Detalle compra'] || !String(row['Detalle compra']).trim()) row['Detalle compra'] = 'COMPRA CANAL';
      return row;
    });
    await dbAdd(cleanRows, 'Importando');
    await reload();
    busy();
    modal('Respaldo Importado', `Se cargaron con éxito ${fn(count)} filas en <b>${b} ${s}</b>.`);
  } catch(e) {
    busy();
    modal('Error al importar JSON', esc(e.message || e));
  }
}

function exportExcelWithCols(rowsToExport, cols, sheetName, fileName) {
  busy('Generando archivo Excel…');
  setTimeout(() => {
    const aoa = [cols];
    rowsToExport.forEach(r => {
      aoa.push(cols.map(c => r[c] ?? ''));
    });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), sheetName);
    XLSX.writeFile(wb, fileName);
    busy();
  }, 50);
}

      canalFinal: $('fcf').value,
      embarque: $('femb').value,
      quincena: $('fq').value,
      precioCambio: $('fpc').value
    };
    S.page = 1;
    clearTimeout(t);
    t = setTimeout(drawMx, 180);
  };
  ['q', 'fe', 'fdet', 'fc', 'fcf', 'femb', 'fq', 'fpc'].forEach(i => $(i).oninput = go);
  drawMx();
}
function drawMx() {
  const f = S.f, q = f.q.toLowerCase();
  const rows = S.rows.filter(r => {
    if (f.etapa && st(r) !== f.etapa) return false;
    if (f.detalle && r['Detalle compra'] !== f.detalle) return false;
    if (f.canal && r['Canal Inicial'] !== f.canal && r['Referencia compra'] !== f.canal) return false;
    if (f.canalFinal) {
      if (f.canalFinal === '__EMPTY__') {
        if (r['Canal Final']) return false;
      } else if (r['Canal Final'] !== f.canalFinal) {
        return false;
      }
    }
    if (f.embarque) {
      if (f.embarque === '__EMPTY__') {
        if (r['EMBARQUE']) return false;
      } else if (r['EMBARQUE'] !== f.embarque) {
        return false;
      }
    }
    if (f.quincena) {
      const qVal = getQuincena(r['Fecha de factura']);
      if (f.quincena === '__EMPTY__') {
        if (qVal) return false;
      } else if (qVal !== f.quincena) {
        return false;
      }
    }
    if (f.precioCambio === 'changed' && !hasPriceChange(r)) return false;
    if (q) {
      const hay = (String(r['Código']) + ' ' + String(r['Descripción']) + ' ' + String(r['Factura']) + ' ' + String(r['EMBARQUE']) + ' ' + String(r['Detalle compra'])).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const totalCantidad = rows.reduce((acc, r) => acc + (Number(r['Cantidad']) || 0), 0);
  const totalValorNeto = rows.reduce((acc, r) => acc + (Number(r['Valor Neto']) || calcValorNeto(r)), 0);
  const pg = rows.slice((S.page - 1) * S.size, S.page * S.size);
  const headers = ['Seg.', 'Detalle compra', 'Código', 'Descripción', 'Color', 'Talla', 'Etapa', 'Ref. Compra', 'Canal Inicial', 'Canal Final', 'Cant.', 'FOB', 'Valor Neto', 'PVP', 'PVP Final', 'Factura', 'F. Factura', 'Embarque'];

  $('tbl').innerHTML = `
    <div class="bg-white border rounded-lg overflow-auto" style="max-height:calc(100vh - 300px)">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-xs text-slate-600">
            ${headers.map((h, i) => `<th class="px-3 py-2 whitespace-nowrap ${i >= 10 && i <= 14 ? 'text-right' : ''}">${h}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${pg.map(r => {
            const pChanged = hasPriceChange(r);
            const pvpIni = Number(r['PVP'] || 0);
            const pvpFin = Number(r['PVP Final'] || 0);
            const badgePrecio = pChanged
              ? `<span class="ml-1 inline-flex items-center px-1.5 py-0.2 rounded text-[10px] font-bold ${pvpFin > pvpIni ? 'bg-amber-100 text-amber-800 border border-amber-300' : 'bg-sky-100 text-sky-800 border border-sky-300'}" title="PVP cambió de ${pvpIni.toFixed(2)} a ${pvpFin.toFixed(2)}">${pvpFin > pvpIni ? '▲' : '▼'}</span>`
              : '';
            const detBadge = r['Detalle compra'] === 'COMPRA EXTRA'
              ? 'bg-teal-50 text-teal-800 border-teal-200'
              : 'bg-slate-100 text-slate-700 border-slate-200';
            return `
            <tr class="r-${st(r)} border-t border-white/60">
              <td class="px-3 py-1.5">${esc(r['Seguimiento'])}</td>
              <td class="px-3 py-1.5 whitespace-nowrap"><span class="text-[11px] font-semibold px-2 py-0.5 rounded border ${detBadge}">${esc(r['Detalle compra'] || 'COMPRA CANAL')}</span></td>
              <td class="px-3 py-1.5 font-medium">${esc(r['Código'])}</td>
              <td class="px-3 py-1.5 max-w-[14rem] truncate" title="${esc(r['Descripción'])}">${esc(r['Descripción'])}</td>
              <td class="px-3 py-1.5">${esc(r['Color'])}</td>
              <td class="px-3 py-1.5">${esc(r['Talla'])}</td>
              <td class="px-3 py-1.5 whitespace-nowrap">${esc(String(r['Etapa']).split('-')[0])}</td>
              <td class="px-3 py-1.5 text-xs text-slate-500">${esc(r['Referencia compra'])}</td>
              <td class="px-3 py-1.5 font-medium">${esc(r['Canal Inicial'] || '')}</td>
              <td class="px-3 py-1.5 font-semibold text-indigo-900">${esc(r['Canal Final'] || '')}</td>
              <td class="px-3 py-1.5 num font-semibold">${fn(r['Cantidad'])}</td>
              <td class="px-3 py-1.5 num text-slate-600">${Number(r['FOB'] || 0).toFixed(2)}</td>
              <td class="px-3 py-1.5 num font-semibold text-slate-800">${fmoney(r['Valor Neto'] || calcValorNeto(r))}</td>
              <td class="px-3 py-1.5 num">${pvpIni.toFixed(2)}</td>
              <td class="px-3 py-1.5 num font-semibold whitespace-nowrap ${pChanged ? 'text-amber-800 bg-amber-100/70' : 'text-emerald-800'}">${pvpFin ? pvpFin.toFixed(2) : '-'}${badgePrecio}</td>
              <td class="px-3 py-1.5 font-medium">${esc(r['Factura'])}</td>
              <td class="px-3 py-1.5 whitespace-nowrap text-xs text-slate-600">${esc(r['Fecha de factura'] || '')}</td>
              <td class="px-3 py-1.5 font-semibold text-slate-700 whitespace-nowrap">${esc(r['EMBARQUE'] || '')}</td>
            </tr>
          `}).join('') || '<tr><td colspan="18" class="p-6 text-center text-slate-500">Sin resultados para estos filtros.</td></tr>'}
        </tbody>
        ${rows.length ? `
        <tfoot>
          <tr class="font-semibold text-slate-800 text-sm">
            <td colspan="10" class="px-3 py-2.5 text-right text-xs uppercase tracking-wider text-slate-500">Totales filtrados:</td>
            <td class="px-3 py-2.5 num font-bold text-slate-900 text-base">${fn(totalCantidad)}</td>
            <td class="px-3 py-2.5"></td>
            <td class="px-3 py-2.5 num font-bold text-indigo-950 text-base">${fmoney(totalValorNeto)}</td>
            <td colspan="5" class="px-3 py-2.5"></td>
          </tr>
        </tfoot>` : ''}
      </table>
    </div>
    ${pager(rows.length)}
  `;
}
function pager(n) {
  const pages = Math.max(1, Math.ceil(n / S.size));
  S.page = Math.min(S.page, pages);
  return `
    <div class="flex items-center gap-2 text-sm mt-3">
      <span class="text-slate-600">${fn(n)} filas</span>
      <span class="ml-auto"></span>
      <select class="border rounded px-2 py-1 bg-white" onchange="S.size=+this.value;S.page=1;drawMx()">
        ${[50, 100, 200].map(x => `<option ${x === S.size ? 'selected' : ''}>${x}</option>`).join('')}
      </select>
      <button class="btn" ${S.page < 2 ? 'disabled' : ''} onclick="S.page--;drawMx()">Anterior</button>
      <span>${S.page} / ${pages}</span>
      <button class="btn" ${S.page >= pages ? 'disabled' : ''} onclick="S.page++;drawMx()">Siguiente</button>
    </div>
  `;
}
function vPrices() {
  const changed = S.rows.filter(hasPriceChange);
  const totalUnits = changed.reduce((a, r) => a + (Number(r['Cantidad']) || 0), 0);
  const uniqueSkus = new Set(changed.map(r => r['Código'])).size;

  $('view').innerHTML = `
    <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
      <div class="grid grid-cols-3 gap-3 max-w-2xl flex-1">
        ${kpi('Códigos afectados', fn(uniqueSkus), 'SKUs distintos', 'border-l-4 border-l-amber-500')}
        ${kpi('Unidades a reetiquetar', fn(totalUnits), 'Total unidades con cambio', 'border-l-4 border-l-amber-500')}
        ${kpi('Líneas detectadas', fn(changed.length), 'Registros en P24', 'border-l-4 border-l-amber-500')}
      </div>
      <button class="btn !bg-amber-600 !text-white !border-amber-600 hover:!bg-amber-700" onclick="exportPriceChanges()">
        <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>Exportar listado de Reetiquetado
      </button>
    </div>
    <div class="bg-white border rounded-lg overflow-auto" style="max-height:calc(100vh - 300px)">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-xs text-slate-600">
            ${['Detalle compra', 'Código', 'Descripción', 'Color', 'Talla', 'Canal Inicial', 'Canal Final', 'Embarque', 'Factura', 'Cant.', 'PVP Inicial', 'PVP Final', 'Variación'].map((h, i) => `<th class="px-3 py-2 whitespace-nowrap ${i >= 9 ? 'text-right' : ''}">${h}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${changed.map(r => {
            const ini = Number(r['PVP'] || 0);
            const fin = Number(r['PVP Final'] || 0);
            const diff = Math.round((fin - ini) * 100) / 100;
            const up = diff > 0;
            return `
            <tr class="border-t hover:bg-amber-50/40">
              <td class="px-3 py-1.5 text-xs font-medium text-slate-600">${esc(r['Detalle compra'] || 'COMPRA CANAL')}</td>
              <td class="px-3 py-1.5 font-semibold text-slate-900">${esc(r['Código'])}</td>
              <td class="px-3 py-1.5 max-w-[14rem] truncate" title="${esc(r['Descripción'])}">${esc(r['Descripción'])}</td>
              <td class="px-3 py-1.5">${esc(r['Color'])}</td>
              <td class="px-3 py-1.5">${esc(r['Talla'])}</td>
              <td class="px-3 py-1.5">${esc(r['Canal Inicial'] || '')}</td>
              <td class="px-3 py-1.5 font-semibold text-indigo-900">${esc(r['Canal Final'] || '')}</td>
              <td class="px-3 py-1.5 font-medium">${esc(r['EMBARQUE'] || '')}</td>
              <td class="px-3 py-1.5">${esc(r['Factura'] || '')}</td>
              <td class="px-3 py-1.5 num font-bold">${fn(r['Cantidad'])}</td>
              <td class="px-3 py-1.5 num text-slate-600">${ini.toFixed(2)}</td>
              <td class="px-3 py-1.5 num font-bold text-slate-900">${fin.toFixed(2)}</td>
              <td class="px-3 py-1.5 num font-bold whitespace-nowrap ${up ? 'text-amber-700' : 'text-sky-700'}">
                ${up ? '+' : ''}${diff.toFixed(2)} (${up ? '▲ Sube' : '▼ Baja'})
              </td>
            </tr>
          `}).join('') || '<tr><td colspan="13" class="p-8 text-center text-slate-500">No se detectan cambios entre PVP Inicial y PVP Final en esta temporada.</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}
function vDrop() {
  const d = S.rows.filter(r => st(r) === 'd');
  const u = d.reduce((a, r) => a + (r['Cantidad'] || 0), 0);
  const fobDrop = d.reduce((a, r) => a + (Number(r['Valor Neto']) || calcValorNeto(r)), 0);
  $('view').innerHTML = `
    <div class="grid grid-cols-2 gap-3 max-w-lg">
      ${kpi('Unidades perdidas (DROP)', fn(u), 'Cancelado por marca', 'border-l-4 border-l-red-600', fobDrop)}
      ${kpi('Líneas en DROP', fn(d.length), 'Registros afectados', 'border-l-4 border-l-red-600')}
    </div>
    <div class="flex justify-end my-3">
      <button class="btn" onclick="exportDrops()"><i data-lucide="file-spreadsheet" class="w-4 h-4"></i>Exportar reporte de DROPS</button>
    </div>
    <div class="bg-white border rounded-lg overflow-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-xs text-slate-600">
            ${['Detalle compra', 'Código', 'Descripción', 'Color', 'Talla', 'Ref. Compra', 'Canal Inicial', 'Embarque', 'Cantidad', 'FOB', 'Valor Neto'].map((h, i) => `<th class="px-3 py-2 ${i >= 8 ? 'text-right' : ''}">${h}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${d.map(r => `
            <tr class="border-t">
              <td class="px-3 py-1.5 text-xs">${esc(r['Detalle compra'] || 'COMPRA CANAL')}</td>
              <td class="px-3 py-1.5 font-medium">${esc(r['Código'])}</td>
              <td class="px-3 py-1.5">${esc(r['Descripción'])}</td>
              <td class="px-3 py-1.5">${esc(r['Color'])}</td>
              <td class="px-3 py-1.5">${esc(r['Talla'])}</td>
              <td class="px-3 py-1.5">${esc(r['Referencia compra'])}</td>
              <td class="px-3 py-1.5 font-medium">${esc(r['Canal Inicial'] || '')}</td>
              <td class="px-3 py-1.5">${esc(r['EMBARQUE'] || '')}</td>
              <td class="px-3 py-1.5 num font-semibold">${fn(r['Cantidad'])}</td>
              <td class="px-3 py-1.5 num">${Number(r['FOB'] || 0).toFixed(2)}</td>
              <td class="px-3 py-1.5 num font-semibold">${fmoney(r['Valor Neto'] || calcValorNeto(r))}</td>
            </tr>
          `).join('') || '<tr><td colspan="11" class="p-6 text-center text-slate-500">No hay cancelaciones (DROP) en esta temporada.</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}
/* ============ INICIALIZACIÓN ============ */
$('fBuyInit').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadBuyInitial(f); };
$('fBuyExtra').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadBuyExtra(f); };
$('fOcPrelim').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadOcPreliminar(f); };
$('fOcFinal').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadOcFinalProducto(f); };
$('fJsonImport').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importJsonBackup(f); };
$('fBrandLogo').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) handleLogoUpload(f); };
$('fPresTemplate').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadPresentationTemplate(f); };
(async () => {
  try {
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => {});
    }
    db = await openDB();
    const m = await rq(db.transaction('meta').objectStore('meta').get('seasons'));
    if (m) S.seasons = m;
    const savedLogos = await rq(db.transaction('meta').objectStore('meta').get('logos'));
    if (savedLogos) S.logos = savedLogos;
    const savedTemplates = await rq(db.transaction('meta').objectStore('meta').get('templates'));
    if (savedTemplates) S.templates = savedTemplates;
    const act = await rq(db.transaction('meta').objectStore('meta').get('active'));
    if (act && act.brand && act.season) {
      S.brand = act.brand;
      S.season = act.season;
    }
    await reload();
  } catch(e) {
    document.body.innerHTML = '<p class="p-8">Error iniciando IndexedDB: ' + esc(e.message) + '</p>';
  }
})();
</script>
