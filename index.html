const TIENDAS_ADIDAS = new Set([
  'CITY', 'CONDADO', 'CAPUEL-CLUB EMELEC', 'EMELEC-TIENDA', 'CUENCA', 'JARDIN',
  'QUICENTRO', 'SAN MARINO', 'SCALA', 'SOL', 'VILLAGE', 'PRO2', 'OCS CUENCA',
  'DORAL', 'SNEAKER COLLECT TIENDA', 'AMBATO', 'SANTO DOMINGO',
  'ORIGINALS SCALA-CONDAD', 'WC02', 'WEB ADIDAS TIENDAS', 'OC SOL'
].map(s => s.trim().toUpperCase()));

const TIENDAS_REEBOK = new Set([
  'CONDADO', 'CUENCA', 'SOL', 'QUICENTRO SUR', 'PRO2'
].map(s => s.trim().toUpperCase()));

function resolverCanalInicial(refCompra, marca) {
  const ref = String(refCompra || '').trim().toUpperCase();
  if (!ref) return '';
  const isAdi = String(marca || '').toUpperCase().includes('ADI');
  const pool = isAdi ? TIENDAS_ADIDAS : TIENDAS_REEBOK;
  if (pool.has(ref)) return 'TIENDAS';
  return normalizarCanal(ref);
}

function normalizarCanal(c) {
  let s = String(c || '').trim().toUpperCase();
  if (s === 'EXCLUSIVO WEB' || s === 'WEB REEBOK MEDEPORT') return 'WEB';
  return s;
}

const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const normTalla = t => String(t || '').trim().replace(',', '.').replace(/^0+/, '');
const st = r => String(r['Etapa'] || '').startsWith('P24') ? 'p' : String(r['Etapa'] || '').startsWith('DROP') ? 'd' : 'o';
const sbKey = () => S.brand + '|' + S.season;
const busy = m => { $('busyMsg').textContent = m || ''; $('busy').classList.toggle('hidden', !m); };
const tick = () => new Promise(r => setTimeout(r, 15));

function fdate(v) {
  if (!v) return '';
  if (v instanceof Date && !isNaN(v)) return v.getFullYear() + '-' + String(v.getMonth() + 1).padStart(2, '0') + '-' + String(v.getDate()).padStart(2, '0');
  return String(v).trim();
}

function getQuincena(fechaStr) {
  const s = String(fechaStr || '').trim();
  if (!s) return '';
  let day = 0;
  if (/^\d{4}-\d{1,2}-\d{1,2}/.test(s)) {
    day = parseInt(s.split('-')[2], 10);
  } else if (/^\d{1,2}\/\d{1,2}\/\d{2,4}/.test(s)) {
    day = parseInt(s.split('/')[0], 10);
  }
  if (!day || isNaN(day)) return '';
  return day <= 15 ? 'q1' : 'q2';
}

/* ============ MOTOR INDEXEDDB LOCAL ============ */
const rq = r => new Promise((ok, ko) => { r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
const txDone = t => new Promise((ok, ko) => { t.oncomplete = ok; t.onerror = t.onabort = () => ko(t.error); });

function openDB() {
  return new Promise((ok, ko) => {
    const r = indexedDB.open('eot-db-local-v4', 1);
    r.onupgradeneeded = () => {
      const s = r.result.createObjectStore('rows', { keyPath: 'id', autoIncrement: true });
      s.createIndex('sb', 'sb');
      r.result.createObjectStore('meta');
    };
    r.onsuccess = () => ok(r.result);
    r.onerror = () => ko(r.error);
  });
}

async function dbAdd(rows, label) {
  for (let i = 0; i < rows.length; i += 10000) {
    const t = db.transaction('rows', 'readwrite'), s = t.objectStore('rows');
    rows.slice(i, i + 10000).forEach(r => s.add(r));
    await txDone(t);
    if (label && rows.length > 10000) {
      busy(label + ' ' + fn(Math.min(i + 10000, rows.length)) + ' / ' + fn(rows.length));
      await tick();
    }
  }
}

async function dbPut(rows) {
  for (let i = 0; i < rows.length; i += 10000) {
    const t = db.transaction('rows', 'readwrite'), s = t.objectStore('rows');
    rows.slice(i, i + 10000).forEach(r => s.put(r));
    await txDone(t);
  }
}

async function dbDeleteIds(ids) {
  for (let i = 0; i < ids.length; i += 10000) {
    const t = db.transaction('rows', 'readwrite'), s = t.objectStore('rows');
    ids.slice(i, i + 10000).forEach(id => s.delete(id));
    await txDone(t);
  }
}

async function dbDelSeason(key) {
  const t = db.transaction('rows', 'readwrite'), s = t.objectStore('rows');
  const ks = await rq(s.index('sb').getAllKeys(key));
  ks.forEach(k => s.delete(k));
  await txDone(t);
}

const dbSeason = key => rq(db.transaction('rows').objectStore('rows').index('sb').getAll(key));

async function getAllBrandRows(brand) {
  const seasonsList = S.seasons[brand] || [];
  const ordered = [S.season, ...seasonsList.filter(s => s !== S.season)];
  let all = [];
  for (const s of ordered) {
    if (!s) continue;
    const chunk = await dbSeason(brand + '|' + s);
    all = all.concat(chunk);
  }
  return all;
}

async function saveMeta() {
  const t = db.transaction('meta', 'readwrite');
  t.objectStore('meta').put(S.seasons, 'seasons');
  t.objectStore('meta').put({ brand: S.brand, season: S.season }, 'active');
  t.objectStore('meta').put(S.logos, 'logos');
  await txDone(t);
}

async function refreshCounts() {
  for (const b in S.seasons) {
    for (const s of S.seasons[b]) {
      S.counts[b + '|' + s] = await rq(db.transaction('rows').objectStore('rows').index('sb').count(b + '|' + s));
    }
  }
}

async function reload() {
  S.rows = S.season ? await dbSeason(sbKey()) : [];
  await refreshCounts();
  render();
}

/* ============ PARSER DE EXCEL (COMPRA INICIAL) ============ */
async function parseExcelFile(file) {
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
  const sheet = wb.SheetNames[0];
  const raw = XLSX.utils.sheet_to_json(wb.Sheets[sheet], { defval: '', raw: true });
  if (!raw.length) throw new Error('El archivo no contiene filas legibles.');
  const fileHeaders = Object.keys(raw[0]);
  const headerMap = {};
  
  MASTER_COLS.forEach(mCol => {
    const nCol = norm(mCol);
    const found = fileHeaders.find(h => norm(h) === nCol);
    if (found) headerMap[mCol] = found;
  });
  
  if (!headerMap['Código'] || !headerMap['Cantidad']) {
    throw new Error('El archivo debe incluir obligatoriamente las columnas "Código" y "Cantidad".');
  }
  
  const rows = [];
  for (const o of raw) {
    const r = {};
    MASTER_COLS.forEach(col => {
      const val = headerMap[col] ? o[headerMap[col]] : '';
      if (NUM_COLS.includes(col)) {
        r[col] = Number(String(val || 0).replace(',', '.')) || 0;
      } else if (col.includes('Fecha')) {
        r[col] = fdate(val);
      } else {
        r[col] = val == null ? '' : String(val).trim();
      }
    });

    if (!r['Canal Inicial']) {
      r['Canal Inicial'] = resolverCanalInicial(r['Referencia compra'], S.brand);
    }
    if (!r['Canal Final']) r['Canal Final'] = '';
    if (!r['PVP Final']) r['PVP Final'] = 0;
    if (!r['P4 Final']) r['P4 Final'] = 0;
    if (!r['PMY Final']) r['PMY Final'] = 0;
    if (!r['Etapa']) r['Etapa'] = E10;
    if (!r['Temporada']) r['Temporada'] = S.season;

    r.sb = sbKey();
    r.brand = S.brand;
    r.season = S.season;
    if (r['Código'] && r['Cantidad'] > 0) rows.push(r);
  }
  return rows;
}

async function revertOcsByKeys(selectedKeys) {
  busy('Revirtiendo OCs y consolidando saldos 10A…');
  await tick();

  const pool10A = new Map();
  S.rows.forEach(r => {
    if (st(r) === 'o') {
      const k = `${norm(r['Código'])}|${norm(r['Color'])}|${normTalla(r['Talla'])}|${norm(r['Referencia compra'])}|${norm(r['Seguimiento'])}`;
      if (!pool10A.has(k)) pool10A.set(k, r);
    }
  });

  const toUpdate = new Set();
  const toDeleteIds = [];
  let revertedUnits = 0;

  for (const r of S.rows) {
    if (st(r) !== 'p') continue;
    const fact = String(r['Factura'] || '').trim() || 'SIN FACTURA';
    const emb = String(r['EMBARQUE'] || '').trim() || 'SIN EMBARQUE';
    const key = `${fact}|||${emb}`;
    if (!selectedKeys.has(key)) continue;

    const qty = Number(r['Cantidad'] || 0);
    revertedUnits += qty;

    const mergeKey = `${norm(r['Código'])}|${norm(r['Color'])}|${normTalla(r['Talla'])}|${norm(r['Referencia compra'])}|${norm(r['Seguimiento'])}`;
    const existing10A = pool10A.get(mergeKey);

    if (existing10A && existing10A.id !== r.id) {
      existing10A['Cantidad'] = (Number(existing10A['Cantidad']) || 0) + qty;
      toUpdate.add(existing10A);
      if (r.id != null) toDeleteIds.push(r.id);
    } else {
      r['Etapa'] = E10;
      r['Factura'] = '';
      r['Fecha de factura'] = '';
      r['EMBARQUE'] = '';
      r['Canal Final'] = '';
      r['PVP Final'] = 0;
      r['P4 Final'] = 0;
      r['PMY Final'] = 0;
      toUpdate.add(r);
      pool10A.set(mergeKey, r);
    }
  }

  if (toUpdate.size) await dbPut([...toUpdate]);
  if (toDeleteIds.length) await dbDeleteIds(toDeleteIds);

  await reload();
  busy();
  modal('OCs Revertidas', `Se devolvieron <b>${fn(revertedUnits)} unidades</b> a estado disponible <b>10A</b>.`);
}

const getRowVal = (o, keys) => {
  for (const k of keys) {
    if (o[k] !== undefined && o[k] !== '') return o[k];
  }
  return '';
};

function mergePools(...lists) {
  const seen = new Set();
  const res = [];
  for (const lst of lists) {
    if (!lst) continue;
    for (const item of lst) {
      if (!seen.has(item)) {
        seen.add(item);
        res.push(item);
      }
    }
  }
  return res;
}

/* ============ 4A. CRUCE OC PRELIMINAR MULTITEMPORADA ============ */
async function loadOcPreliminar(file) {
  try {
    busy('Leyendo OC preliminar y cargando temporadas de ' + S.brand + '…');
    await tick();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    const targetSheet = wb.Sheets['OC'] ? 'OC' : wb.SheetNames[0];
    const raw = XLSX.utils.sheet_to_json(wb.Sheets[targetSheet], { defval: '', raw: true });
    if (!raw.length) throw new Error('No se encontraron filas en el archivo de OC.');

    const allBrandRows = await getAllBrandRows(S.brand);

    const seasonExactIndex = new Map();
    const seasonSkuTalIndex = new Map();
    const exactIndex = new Map();
    const skuTallaIndex = new Map();

    allBrandRows.forEach(r => {
      if (st(r) === 'o') {
        const temp = norm(r.season || r['Temporada']);
        const cod = norm(r['Código']);
        const col = norm(r['Color']);
        const tal = normTalla(r['Talla']);

        const kSExact = `${temp}|${cod}|${col}|${tal}`;
        const kSSkuTal = `${temp}|${cod}|${tal}`;
        const kExact = `${cod}|${col}|${tal}`;
        const kSkuTal = `${cod}|${tal}`;

        if (!seasonExactIndex.has(kSExact)) seasonExactIndex.set(kSExact, []);
        seasonExactIndex.get(kSExact).push(r);

        if (!seasonSkuTalIndex.has(kSSkuTal)) seasonSkuTalIndex.set(kSSkuTal, []);
        seasonSkuTalIndex.get(kSSkuTal).push(r);

        if (!exactIndex.has(kExact)) exactIndex.set(kExact, []);
        exactIndex.get(kExact).push(r);

        if (!skuTallaIndex.has(kSkuTal)) skuTallaIndex.set(kSkuTal, []);
        skuTallaIndex.get(kSkuTal).push(r);
      }
    });

    const changed = new Set();
    const added = [];
    let matchedUnits = 0;
    let matchedLines = 0;
    const perSeasonUnits = {};
    const unmatched = [];

    for (const o of raw) {
      const temp = norm(getRowVal(o, ['Temporada', 'Season']));
      const cod = norm(getRowVal(o, ['Código', 'Codigo', 'SAP']));
      const col = norm(getRowVal(o, ['Color']));
      const tal = normTalla(getRowVal(o, ['Talla']));
      const qty = Number(String(getRowVal(o, ['Cantidad', 'QTY']) || 0).replace(',', '.')) || 0;
      const fact = String(getRowVal(o, ['Factura', 'No FACTURA '])).trim();
      const embFinal = String(getRowVal(o, ['EMBARQUE', 'Embarque', 'Nº de embarque', 'EMBARQUES'])).trim();
      const fFact = fdate(getRowVal(o, ['Fecha de factura']));
      const refFinal = String(getRowVal(o, ['Referencia compra', 'CANAL'])).trim();

      if (!cod || qty <= 0) continue;

      const pool = mergePools(
        temp ? seasonExactIndex.get(`${temp}|${cod}|${col}|${tal}`) : null,
        exactIndex.get(`${cod}|${col}|${tal}`),
        temp ? seasonSkuTalIndex.get(`${temp}|${cod}|${tal}`) : null,
        skuTallaIndex.get(`${cod}|${tal}`)
      );

      if (!pool.length || !pool.some(r => r['Cantidad'] > 0)) {
        unmatched.push({ cod: o['Código'], col: o['Color'], tal: o['Talla'], qty });
        continue;
      }

      let rem = qty;
      for (let i = 0; i < pool.length && rem > 0; i++) {
        const baseRow = pool[i];
        if (baseRow['Cantidad'] <= 0 || baseRow['Etapa'].startsWith('P24')) continue;
        const rowSeason = baseRow.season || S.season;

        if (baseRow['Cantidad'] <= rem) {
          const take = baseRow['Cantidad'];
          rem -= take;
          matchedUnits += take;
          perSeasonUnits[rowSeason] = (perSeasonUnits[rowSeason] || 0) + take;

          baseRow['Etapa'] = EP;
          if (fact) baseRow['Factura'] = fact;
          if (fFact) baseRow['Fecha de factura'] = fFact;
          if (embFinal) baseRow['EMBARQUE'] = embFinal;
          if (refFinal && !baseRow['Referencia compra']) baseRow['Referencia compra'] = refFinal;
          changed.add(baseRow);
        } else {
          const facturada = { ...baseRow };
          delete facturada.id;
          facturada['Cantidad'] = rem;
          facturada['Etapa'] = EP;
          if (fact) facturada['Factura'] = fact;
          if (fFact) facturada['Fecha de factura'] = fFact;
          if (embFinal) facturada['EMBARQUE'] = embFinal;
          if (refFinal && !facturada['Referencia compra']) facturada['Referencia compra'] = refFinal;

          baseRow['Cantidad'] -= rem;
          matchedUnits += rem;
          perSeasonUnits[rowSeason] = (perSeasonUnits[rowSeason] || 0) + rem;
          rem = 0;
          changed.add(baseRow);
          added.push(facturada);
        }
      }
      matchedLines++;
    }

    busy();
    const breakdown = Object.entries(perSeasonUnits)
      .map(([sName, u]) => `<span class="inline-block bg-slate-100 border px-2 py-0.5 rounded text-xs font-semibold mr-1.5">${esc(sName)}: ${fn(u)} unid.</span>`)
      .join('');

    const ch = await modal(
      'Confirmar cruce preliminar',
      `<p>Se descontaron con éxito <b>${fn(matchedUnits)} unidades</b> en ${fn(matchedLines)} líneas que pasan a <b>P24</b>:</p>
       <div class="my-2">${breakdown || '<span class="text-xs text-slate-400">Sin unidades cruzadas</span>'}</div>
       <p class="text-xs text-slate-500 mt-1">El saldo 10A ha quedado liberado en sus respectivas temporadas.</p>
       ${unmatched.length ? `<p class="text-amber-600 mt-2 text-xs"><b>${unmatched.length} filas</b> no encontraron saldo disponible en ninguna temporada de ${S.brand}.</p>` : ''}`,
      [['Cancelar', 'c'], ['Aplicar a la base', 'ok', 1]]
    );
    if (ch !== 'ok') return;

    busy('Actualizando base de datos…');
    await tick();
    await dbPut([...changed]);
    if (added.length) await dbAdd(added);
    await reload();
    busy();
    modal('OC Preliminar Cargada', `Se pasaron ${fn(matchedUnits)} unidades a <b>P24</b>.`);
  } catch(e) {
    busy();
    modal('Error en cruce preliminar', esc(e.message || e));
  }
}

/* ============ 4B. CRUCE OC FINAL DE PRODUCTO MULTITEMPORADA ============ */
async function loadOcFinalProducto(file) {
  try {
    busy('Leyendo OC final de Producto en temporadas de ' + S.brand + '…');
    await tick();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    const targetSheet = wb.Sheets['Hoja1'] ? 'Hoja1' : (wb.Sheets['OC'] ? 'OC' : wb.SheetNames[0]);
    const raw = XLSX.utils.sheet_to_json(wb.Sheets[targetSheet], { defval: '', raw: true });
    if (!raw.length) throw new Error('No se encontraron filas en la hoja de OC de Producto.');

    const allBrandRows = await getAllBrandRows(S.brand);

    const p24SeasonExact = new Map();
    const p24ExactIndex = new Map();
    const p24SkuTalIndex = new Map();
    const p24FallbackIndex = new Map();

    allBrandRows.forEach(r => {
      if (st(r) === 'p') {
        const temp = norm(r.season || r['Temporada']);
        const cod = norm(r['Código']);
        const col = norm(r['Color']);
        const tal = normTalla(r['Talla']);
        const emb = norm(r['EMBARQUE']);
        const fact = norm(r['Factura']);
        
        const kSExact = `${temp}|${cod}|${col}|${tal}|${emb}|${fact}`;
        const kExact = `${cod}|${col}|${tal}|${emb}|${fact}`;
        const kSkuTal = `${cod}|${tal}|${emb}|${fact}`;
        const kFallback = `${cod}|${col}|${tal}`;

        if (!p24SeasonExact.has(kSExact)) p24SeasonExact.set(kSExact, []);
        p24SeasonExact.get(kSExact).push(r);

        if (!p24ExactIndex.has(kExact)) p24ExactIndex.set(kExact, []);
        p24ExactIndex.get(kExact).push(r);

        if (!p24SkuTalIndex.has(kSkuTal)) p24SkuTalIndex.set(kSkuTal, []);
        p24SkuTalIndex.get(kSkuTal).push(r);

        if (!p24FallbackIndex.has(kFallback)) p24FallbackIndex.set(kFallback, []);
        p24FallbackIndex.get(kFallback).push(r);
      }
    });

    const changed = new Set();
    const added = [];
    let updatedUnits = 0;
    let updatedLines = 0;
    const perSeasonUnits = {};
    const unmatched = [];

    for (const o of raw) {
      const temp = norm(getRowVal(o, ['Temporada', 'Season']));
      const cod = norm(getRowVal(o, ['Código', 'Codigo', 'SAP']));
      const col = norm(getRowVal(o, ['Color']));
      const tal = normTalla(getRowVal(o, ['Talla']));
      const qty = Number(String(getRowVal(o, ['Cantidad', 'QTY', 'LPN DETAIL SIZE VALUE']) || 0).replace(',', '.')) || 0;
      const fact = norm(getRowVal(o, ['Factura', 'No FACTURA ']));
      const emb = norm(getRowVal(o, ['EMBARQUE', 'Embarque', 'Nº de embarque', 'EMBARQUES']));

      const cFinalRaw = getRowVal(o, ['CANAL FINAL', 'CANAL FINAL ', 'CANAL_FINAL', 'Canal Final', 'CANAL']);
      const cFinal = normalizarCanal(cFinalRaw);

      const pvpFin = Number(String(getRowVal(o, ['PVP.1', 'PVP FINAL', 'PVP Final', 'PVP']) || 0).replace(',', '.')) || 0;
      const p4Fin = Number(String(getRowVal(o, ['P4.1', 'P4 FINAL', 'P4 Final', 'P4']) || 0).replace(',', '.')) || 0;
      const pmyFin = Number(String(getRowVal(o, ['PMY.1', 'PMY FINAL', 'PMY Final', 'PMY']) || 0).replace(',', '.')) || 0;

      if (!cod || qty <= 0) continue;

      const pool = mergePools(
        temp ? p24SeasonExact.get(`${temp}|${cod}|${col}|${tal}|${emb}|${fact}`) : null,
        p24ExactIndex.get(`${cod}|${col}|${tal}|${emb}|${fact}`),
        p24SkuTalIndex.get(`${cod}|${tal}|${emb}|${fact}`),
        p24FallbackIndex.get(`${cod}|${col}|${tal}`)
      );

      if (!pool.length || !pool.some(r => r['Cantidad'] > 0)) {
        unmatched.push({ cod: o['Código'], col: o['Color'], tal: o['Talla'], qty });
        continue;
      }

      let rem = qty;
      for (let i = 0; i < pool.length && rem > 0; i++) {
        const baseRow = pool[i];
        if (baseRow['Cantidad'] <= 0) continue;
        const rowSeason = baseRow.season || S.season;

        if (baseRow['Cantidad'] <= rem) {
          const take = baseRow['Cantidad'];
          rem -= take;
          updatedUnits += take;
          perSeasonUnits[rowSeason] = (perSeasonUnits[rowSeason] || 0) + take;

          if (cFinal) baseRow['Canal Final'] = cFinal;
          if (pvpFin) baseRow['PVP Final'] = pvpFin;
          if (p4Fin) baseRow['P4 Final'] = p4Fin;
          if (pmyFin) baseRow['PMY Final'] = pmyFin;
          changed.add(baseRow);
        } else {
          const splitRow = { ...baseRow };
          delete splitRow.id;
          splitRow['Cantidad'] = rem;
          if (cFinal) splitRow['Canal Final'] = cFinal;
          if (pvpFin) splitRow['PVP Final'] = pvpFin;
          if (p4Fin) splitRow['P4 Final'] = p4Fin;
          if (pmyFin) splitRow['PMY Final'] = pmyFin;

          baseRow['Cantidad'] -= rem;
          updatedUnits += rem;
          perSeasonUnits[rowSeason] = (perSeasonUnits[rowSeason] || 0) + rem;
          rem = 0;
          changed.add(baseRow);
          added.push(splitRow);
        }
      }
      updatedLines++;
    }

    busy();
    const breakdown = Object.entries(perSeasonUnits)
      .map(([sName, u]) => `<span class="inline-block bg-slate-100 border px-2 py-0.5 rounded text-xs font-semibold mr-1.5">${esc(sName)}: ${fn(u)} unid.</span>`)
      .join('');

    const ch = await modal(
      'Confirmar actualización final de Producto',
      `<p>Se actualizaron con éxito <b>${fn(updatedUnits)} unidades</b> en ${fn(updatedLines)} líneas con sus <b>Canales Finales y Precios Confirmados</b>:</p>
       <div class="my-2">${breakdown || '<span class="text-xs text-slate-400">Sin unidades actualizadas</span>'}</div>
       <p class="text-xs text-slate-500 mt-1">Tu compra inicial 10A no se vio alterada.</p>
       ${unmatched.length ? `<p class="text-amber-600 mt-2 text-xs"><b>${unmatched.length} filas</b> no encontraron registro P24 previo en las temporadas de ${S.brand}.</p>` : ''}`,
      [['Cancelar', 'c'], ['Actualizar líneas P24', 'ok', 1]]
    );
    if (ch !== 'ok') return;

    busy('Guardando actualización en la base local…');
    await tick();
    await dbPut([...changed]);
    if (added.length) await dbAdd(added);
    await reload();
    busy();
    modal('OC Final Aplicada', `Se actualizaron los canales finales y precios para ${fn(updatedUnits)} unidades en <b>P24</b>.`);
  } catch(e) {
    busy();
    modal('Error al aplicar OC final', esc(e.message || e));
  }
}

/* ============ 5. EXPORTAR / IMPORTAR RESPALDO JSON COMPARTIBLE ============ */
function exportJsonBackup() {
  if (!S.rows.length) return modal('Sin datos', 'No hay datos en esta temporada para exportar.');
  busy('Generando archivo JSON…');
  setTimeout(() => {
    const payload = {
      app: 'EOT_MEDEPORT',
      version: '4.3',
      brand: S.brand,
      season: S.season,
      exportedAt: new Date().toISOString(),
      rowCount: S.rows.length,
      rows: S.rows.map(r => {
        const o = { ...r };
        delete o.id;
        return o;
      })
    };
    const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Tracking_Compra_Medeport_${S.brand}_${S.season}_${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    busy();
  }, 50);
}

async function importJsonBackup(file) {
  try {
    busy('Leyendo archivo JSON…');
    await tick();
    const text = await file.text();
    const data = JSON.parse(text);

    if (!data.rows || !Array.isArray(data.rows)) {
      throw new Error('El archivo JSON no tiene el formato de respaldo válido del sistema.');
    }

    const b = data.brand || S.brand;
    const s = data.season || S.season;
    const count = data.rows.length;

    busy();
    const c = await modal(
      'Importar respaldo JSON',
      `El archivo contiene <b>${fn(count)} filas</b> correspondientes a <b>${b} ${s}</b>.<br><br>
      ¿Deseas cargar estos datos en tu navegador? Se reemplazarán los registros actuales de esa temporada.`,
      [['Cancelar', 'c'], ['Sí, importar datos', 'ok', 1]]
    );
    if (c !== 'ok') return;

    if (!S.seasons[b]) S.seasons[b] = [];
    if (!S.seasons[b].includes(s)) S.seasons[b].push(s);

    S.brand = b;
    S.season = s;
    const targetKey = b + '|' + s;
    await saveMeta();

    busy('Guardando datos en la base local…');
    await tick();
    await dbDelSeason(targetKey);
    
    const cleanRows = data.rows.map(r => ({ ...r, sb: targetKey, brand: b, season: s }));
    await dbAdd(cleanRows, 'Importando');
    await reload();
    busy();
    modal('Respaldo Importado', `Se cargaron con éxito ${fn(count)} filas en <b>${b} ${s}</b>.`);
  } catch(e) {
    busy();
    modal('Error al importar JSON', esc(e.message || e));
  }
}

/* ============ 6. EXPORTACIONES EXCEL (34 COLUMNAS SIN FOB) ============ */
function exportFullExcel() {
  if (!S.rows.length) return modal('Sin datos', 'No hay datos para exportar.');
  busy('Generando archivo Excel…');
  setTimeout(() => {
    const aoa = [MASTER_COLS];
    S.rows.forEach(r => {
      aoa.push(MASTER_COLS.map(c => r[c] ?? ''));
    });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'Sheet1');
    XLSX.writeFile(wb, `SITUACION_SEGUIMIENTOS_${S.brand}_${S.season}.xlsx`);
    busy();
  }, 50);
}

function exportDrops() {
  const d = S.rows.filter(r => st(r) === 'd');
  if (!d.length) return modal('Sin DROPS', 'No hay cancelaciones (DROP) en esta temporada.');
  const aoa = [
    ['Código', 'Descripción', 'Color', 'Talla', 'Ref. Compra', 'Canal Inicial', 'Canal Final', 'EMBARQUE', 'Cantidad'],
    ...d.map(r => [

        <option value="">Todos los embarques</option>
        <option value="__EMPTY__">Sin embarque asignado</option>
        ${embarques.map(e => `<option>${esc(e)}</option>`).join('')}
      </select>
      <select id="fq" class="border rounded px-2.5 py-2 text-sm bg-white">
        <option value="">Todas las fechas factura</option>
        <option value="q1">1ra Quincena (Días 1 - 15)</option>
        <option value="q2">2da Quincena (Días 16 - 31)</option>
        <option value="__EMPTY__">Sin fecha de factura</option>
      </select>
    </div>
    <div id="tbl"></div>
  `;
  $('fe').value = S.f.etapa;
  $('fc').value = S.f.canal;
  $('fcf').value = S.f.canalFinal;
  $('femb').value = S.f.embarque;
  $('fq').value = S.f.quincena;

  let t;
  const go = () => {
    S.f = {
      q: $('q').value,
      etapa: $('fe').value,
      canal: $('fc').value,
      canalFinal: $('fcf').value,
      embarque: $('femb').value,
      quincena: $('fq').value
    };
    S.page = 1;
    clearTimeout(t);
    t = setTimeout(drawMx, 180);
  };
  ['q', 'fe', 'fc', 'fcf', 'femb', 'fq'].forEach(i => $(i).oninput = go);
  drawMx();
}

function drawMx() {
  const f = S.f, q = f.q.toLowerCase();
  const rows = S.rows.filter(r => {
    if (f.etapa && st(r) !== f.etapa) return false;
    if (f.canal && r['Canal Inicial'] !== f.canal && r['Referencia compra'] !== f.canal) return false;

    if (f.canalFinal) {
      if (f.canalFinal === '__EMPTY__') {
        if (r['Canal Final']) return false;
      } else if (r['Canal Final'] !== f.canalFinal) {
        return false;
      }
    }

    if (f.embarque) {
      if (f.embarque === '__EMPTY__') {
        if (r['EMBARQUE']) return false;
      } else if (r['EMBARQUE'] !== f.embarque) {
        return false;
      }
    }

    if (f.quincena) {
      const qVal = getQuincena(r['Fecha de factura']);
      if (f.quincena === '__EMPTY__') {
        if (qVal) return false;
      } else if (qVal !== f.quincena) {
        return false;
      }
    }

    if (q) {
      const hay = (String(r['Código']) + ' ' + String(r['Descripción']) + ' ' + String(r['Factura']) + ' ' + String(r['EMBARQUE'])).toLowerCase();
      if (!hay.includes(q)) return false;
    }

    return true;
  });

  const totalCantidad = rows.reduce((acc, r) => acc + (Number(r['Cantidad']) || 0), 0);
  const pg = rows.slice((S.page - 1) * S.size, S.page * S.size);

  $('tbl').innerHTML = `
    <div class="bg-white border rounded-lg overflow-auto" style="max-height:calc(100vh - 300px)">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-xs text-slate-600">
            ${['Seg.', 'Código', 'Descripción', 'Color', 'Talla', 'Etapa', 'Ref. Compra', 'Canal Inicial', 'Canal Final', 'Cant.', 'PVP', 'PVP Final', 'Factura', 'F. Factura', 'Embarque'].map((h, i) => `<th class="px-3 py-2 whitespace-nowrap ${i >= 9 && i <= 11 ? 'text-right' : ''}">${h}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${pg.map(r => `
            <tr class="r-${st(r)} border-t border-white/60">
              <td class="px-3 py-1.5">${esc(r['Seguimiento'])}</td>
              <td class="px-3 py-1.5 font-medium">${esc(r['Código'])}</td>
              <td class="px-3 py-1.5 max-w-[14rem] truncate" title="${esc(r['Descripción'])}">${esc(r['Descripción'])}</td>
              <td class="px-3 py-1.5">${esc(r['Color'])}</td>
              <td class="px-3 py-1.5">${esc(r['Talla'])}</td>
              <td class="px-3 py-1.5 whitespace-nowrap">${esc(String(r['Etapa']).split('-')[0])}</td>
              <td class="px-3 py-1.5 text-xs text-slate-500">${esc(r['Referencia compra'])}</td>
              <td class="px-3 py-1.5 font-medium">${esc(r['Canal Inicial'] || '')}</td>
              <td class="px-3 py-1.5 font-semibold text-indigo-900">${esc(r['Canal Final'] || '')}</td>
              <td class="px-3 py-1.5 num font-semibold">${fn(r['Cantidad'])}</td>
              <td class="px-3 py-1.5 num">${Number(r['PVP'] || 0).toFixed(2)}</td>
              <td class="px-3 py-1.5 num font-semibold text-emerald-800">${Number(r['PVP Final'] || 0) ? Number(r['PVP Final']).toFixed(2) : '-'}</td>
              <td class="px-3 py-1.5 font-medium">${esc(r['Factura'])}</td>
              <td class="px-3 py-1.5 whitespace-nowrap text-xs text-slate-600">${esc(r['Fecha de factura'] || '')}</td>
              <td class="px-3 py-1.5 font-semibold text-slate-700 whitespace-nowrap">${esc(r['EMBARQUE'] || '')}</td>
            </tr>
          `).join('') || '<tr><td colspan="15" class="p-6 text-center text-slate-500">Sin resultados para estos filtros.</td></tr>'}
        </tbody>
        ${rows.length ? `
        <tfoot>
          <tr class="font-semibold text-slate-800 text-sm">
            <td colspan="9" class="px-3 py-2.5 text-right text-xs uppercase tracking-wider text-slate-500">Total unidades filtradas:</td>
            <td class="px-3 py-2.5 num font-bold text-slate-900 text-base">${fn(totalCantidad)}</td>
            <td colspan="5" class="px-3 py-2.5"></td>
          </tr>
        </tfoot>` : ''}
      </table>
    </div>
    ${pager(rows.length)}
  `;
}

function pager(n) {
  const pages = Math.max(1, Math.ceil(n / S.size));
  S.page = Math.min(S.page, pages);
  return `
    <div class="flex items-center gap-2 text-sm mt-3">
      <span class="text-slate-600">${fn(n)} filas</span>
      <span class="ml-auto"></span>
      <select class="border rounded px-2 py-1 bg-white" onchange="S.size=+this.value;S.page=1;drawMx()">
        ${[50, 100, 200].map(x => `<option ${x === S.size ? 'selected' : ''}>${x}</option>`).join('')}
      </select>
      <button class="btn" ${S.page < 2 ? 'disabled' : ''} onclick="S.page--;drawMx()">Anterior</button>
      <span>${S.page} / ${pages}</span>
      <button class="btn" ${S.page >= pages ? 'disabled' : ''} onclick="S.page++;drawMx()">Siguiente</button>
    </div>
  `;
}

function vDrop() {
  const d = S.rows.filter(r => st(r) === 'd');
  const u = d.reduce((a, r) => a + (r['Cantidad'] || 0), 0);
  $('view').innerHTML = `
    <div class="grid grid-cols-2 gap-3 max-w-md">
      ${kpi('Unidades perdidas (DROP)', fn(u), 'Cancelado por marca', 'border-l-4 border-l-red-600')}
      ${kpi('Líneas en DROP', fn(d.length), 'Registros afectados', 'border-l-4 border-l-red-600')}
    </div>
    <div class="flex justify-end my-3">
      <button class="btn" onclick="exportDrops()"><i data-lucide="file-spreadsheet" class="w-4 h-4"></i>Exportar reporte de DROPS</button>
    </div>
    <div class="bg-white border rounded-lg overflow-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-xs text-slate-600">
            ${['Código', 'Descripción', 'Color', 'Talla', 'Ref. Compra', 'Canal Inicial', 'Embarque', 'Cantidad'].map((h, i) => `<th class="px-3 py-2 ${i === 7 ? 'text-right' : ''}">${h}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${d.map(r => `
            <tr class="border-t">
              <td class="px-3 py-1.5 font-medium">${esc(r['Código'])}</td>
              <td class="px-3 py-1.5">${esc(r['Descripción'])}</td>
              <td class="px-3 py-1.5">${esc(r['Color'])}</td>
              <td class="px-3 py-1.5">${esc(r['Talla'])}</td>
              <td class="px-3 py-1.5">${esc(r['Referencia compra'])}</td>
              <td class="px-3 py-1.5 font-medium">${esc(r['Canal Inicial'] || '')}</td>
              <td class="px-3 py-1.5">${esc(r['EMBARQUE'] || '')}</td>
              <td class="px-3 py-1.5 num font-semibold">${fn(r['Cantidad'])}</td>
            </tr>
          `).join('') || '<tr><td colspan="8" class="p-6 text-center text-slate-500">No hay cancelaciones (DROP) en esta temporada.</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

/* ============ INICIALIZACIÓN ============ */
$('fBuyInit').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadBuyInitial(f); };
$('fBuyExtra').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadBuyExtra(f); };
$('fOcPrelim').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadOcPreliminar(f); };
$('fOcFinal').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadOcFinalProducto(f); };
$('fJsonImport').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importJsonBackup(f); };
$('fBrandLogo').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) handleLogoUpload(f); };

(async () => {
  try {
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => {});
    }
    db = await openDB();
    const m = await rq(db.transaction('meta').objectStore('meta').get('seasons'));
    if (m) S.seasons = m;
    const savedLogos = await rq(db.transaction('meta').objectStore('meta').get('logos'));
    if (savedLogos) S.logos = savedLogos;
    const act = await rq(db.transaction('meta').objectStore('meta').get('active'));
    if (act && act.brand && act.season) {
      S.brand = act.brand;
      S.season = act.season;
    }
    await reload();
  } catch(e) {
    document.body.innerHTML = '<p class="p-8">Error iniciando IndexedDB: ' + esc(e.message) + '</p>';
  }
})();
</script>
</body>
</html>
